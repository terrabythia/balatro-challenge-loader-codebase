services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: challenge_hub
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5455:5432"
    restart: unless-stopped

volumes:
  pgdata:
